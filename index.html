<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Forge PPL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header, content column (max 760px), bottom tab bar on phone / left rail on desktop.
   Palette echoes the old training sheet: crimson for push, steel blue for pull, amber for legs, teal for nutrition. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#E4E7EE; --ink:#111725; --muted:#596277; --line:#D5D9E2;
  --accent:#C8233A; --accent-soft:#F9E1E5; --on-accent:#FFFFFF;
  --pull:#2952C7; --pull-soft:#E0E8FB; --legs:#B86E06; --legs-soft:#FBEBD2; --acc:#6D46C9; --acc-soft:#ECE5FB; --teal:#0F8466; --teal-soft:#D8F1E9;
  --good:#0F8466; --warn:#B86E06; --bad:#C0392B;
  --shadow:0 1px 2px rgba(17,23,37,.06),0 4px 14px rgba(17,23,37,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F17; --surface:#151A26; --surface-2:#1E2433; --ink:#E8EBF2; --muted:#8F98AC; --line:#283043;
  --accent:#FF5266; --accent-soft:#3A1A22; --on-accent:#14080B;
  --pull:#7FA0FF; --pull-soft:#1B2647; --legs:#F2A93B; --legs-soft:#3A2A12; --acc:#B49CFF; --acc-soft:#2A2147; --teal:#35C99E; --teal-soft:#123328;
  --good:#35C99E; --warn:#F2A93B; --bad:#FF6B5B; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F17; --surface:#151A26; --surface-2:#1E2433; --ink:#E8EBF2; --muted:#8F98AC; --line:#283043;
  --accent:#FF5266; --accent-soft:#3A1A22; --on-accent:#14080B;
  --pull:#7FA0FF; --pull-soft:#1B2647; --legs:#F2A93B; --legs-soft:#3A2A12; --acc:#B49CFF; --acc-soft:#2A2147; --teal:#35C99E; --teal-soft:#123328;
  --good:#35C99E; --warn:#F2A93B; --bad:#FF6B5B; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.disp{font-family:var(--f-display);letter-spacing:.01em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:760px;margin:0 auto;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--good)} .sync.local i{background:var(--warn)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;flex:0 0 auto}
.avatar.lg{width:42px;height:42px;font-size:22px}
main#view{max-width:760px;margin:0 auto;padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:var(--nav-h)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:500;text-decoration:none;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:980px){
  .tabs{top:56px;bottom:0;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);padding:16px 12px}
  .tabs-in{display:flex;flex-direction:column;height:auto;gap:4px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:14.5px}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  main#view{padding-bottom:40px}
  .top-in,main#view{margin-left:max(240px,calc(50vw - 380px + 105px))}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h2{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.sec-title{font-family:var(--f-display);font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:600;font-size:14.5px;text-decoration:none;min-height:44px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-teal{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.up{background:var(--teal-soft);color:var(--good)}
.chip.down{background:var(--accent-soft);color:var(--bad)}
.chip.reps{background:var(--pull-soft);color:var(--pull)}
.chip.start{background:var(--legs-soft);color:var(--legs)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.input:focus{border-color:var(--accent);outline:none}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}

/* home */
.hero{border-radius:18px;padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid var(--sess-soft);pointer-events:none}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:46px;text-transform:uppercase;letter-spacing:.01em;color:var(--sess)}
.hero .sub{font-size:15px;font-weight:600}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.ex-list{display:flex;flex-direction:column}
.ex-li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.ex-li .nm{font-weight:600;font-size:14.5px;min-width:0}
.ex-li .sc{font-size:12.5px;color:var(--muted)}
.ex-li .tg{grid-row:1/3;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ex-li .tg b{font-family:var(--f-display);font-size:21px;font-weight:700}
.rot{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.rot span{flex:0 0 auto;padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.rot span.on{color:var(--on-accent);background:var(--sess)}
.rot span.done{text-decoration:line-through;opacity:.6}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
button.tile{cursor:pointer}
.tile .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.tile .big small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.days{display:flex;gap:5px}
.days span{flex:1;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.days span.on{background:var(--accent);color:var(--on-accent)}
.days span.on-c{background:var(--teal);color:var(--surface)}
.wu-list{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.wu{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.wu .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line)}
.wu.on .box{background:var(--good);border-color:var(--good)}
.wu.on .wn{text-decoration:line-through;color:var(--muted)}
.wu .wd{font-size:12.5px;color:var(--muted)}
details.ex-card>summary{cursor:pointer}
.lvl{display:flex;align-items:center;gap:4px}
.lvl i{width:18px;height:6px;border-radius:3px;background:var(--surface-2)}
.lvl i.on{background:var(--sess)}
.lvl span{margin-left:6px}
.mob-now{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.mob-now h2{font-family:var(--f-display);font-size:30px;font-weight:700;text-transform:uppercase;color:var(--sess)}
.mob-t{font-family:var(--f-display);font-size:72px;font-weight:700;line-height:1}
.mob-now p{max-width:46ch}
.days span.today{outline:1.5px solid var(--ink)}
.insight{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.insight:first-of-type{border-top:0}
.insight .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px}
.dot.good{background:var(--teal-soft);color:var(--good)} .dot.warn{background:var(--legs-soft);color:var(--warn)} .dot.bad{background:var(--accent-soft);color:var(--bad)} .dot.info{background:var(--pull-soft);color:var(--pull)}
.banner{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent)}

/* program */
.sess-card{border-top:4px solid var(--sess)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.prog{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.prog th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.prog td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.prog td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.cue{font-size:12.5px;color:var(--muted);margin-top:2px}
.principles{display:grid;gap:10px}
@media (min-width:640px){.principles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pr{padding:12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.pr b{display:block;font-size:14px;margin-bottom:3px}

/* workout overlay */
#workout{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.w-head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w-head-in{max-width:760px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:10px}
.w-title{flex:1;min-width:0}
.w-title h2{font-family:var(--f-display);font-size:24px;font-weight:700;text-transform:uppercase;color:var(--sess);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-prog{height:4px;background:var(--surface-2)}
.w-prog i{display:block;height:100%;background:var(--sess);transition:width .3s}
.w-body{max-width:760px;margin:0 auto;padding-block:16px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-card.complete{border-color:var(--good)}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-n{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--sess-soft);color:var(--sess);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.ex-card.complete .ex-n{background:var(--good);color:var(--surface)}
.ex-head h3{font-size:16px;font-weight:700}
.exanim{position:relative;display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;width:100%;max-width:100%;flex:0 0 auto;cursor:zoom-in}
.exanim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exanim img+img{animation:exflip 1.8s steps(1,end) infinite}
@keyframes exflip{0%{opacity:0}50%{opacity:1}}
.exanim.thumb{width:92px;flex:0 0 auto}
.exanim.prog{width:min(260px,100%);margin:8px 0}
.exanim.big{width:100%;max-width:520px;align-self:center;cursor:default}
.target{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;padding:9px 11px;border-radius:10px;background:var(--surface-2)}
.target b{font-family:var(--f-display);font-size:19px}
.sets{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 48px;gap:6px 8px;align-items:center}
.sets .hd{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.sets .sn{text-align:center;font-weight:700;color:var(--muted);font-family:var(--f-display);font-size:18px}
.sets input{width:100%;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:46px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sets input:focus{border-color:var(--sess);outline:none}
.check{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.set-done input{background:var(--teal-soft);border-color:transparent}
.feel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.feel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.feel button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.restpill{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.restpill .t{font-family:var(--f-display);font-size:30px;font-weight:700;min-width:70px;font-variant-numeric:tabular-nums}
.restpill .lbl{flex:1;font-size:12.5px;line-height:1.3;min-width:0}
.restpill button{border:0;border-radius:9px;padding:8px 10px;background:rgba(127,127,127,.25);color:inherit;font-weight:600;font-size:13px}
.restpill .rb{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:9px;background:rgba(127,127,127,.3);overflow:hidden}
.restpill .rb i{display:block;height:100%;background:var(--accent)}
.restpill.over{background:var(--good);color:var(--surface)}

/* sheet / toast */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,10,16,.5)}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){#sheet{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}

/* nutrition */
.ring-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:34px;line-height:1;display:block}
.qa{display:flex;flex-wrap:wrap;gap:7px}
.qa button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;text-align:left;display:flex;flex-direction:column;line-height:1.25}
.qa button span{font-size:11.5px;color:var(--teal);font-weight:600}
.food-li{display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.food-li .x{border:0;background:none;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:8px}
.pbars{display:flex;align-items:flex-end;gap:5px;height:120px;position:relative;padding-top:6px}
.pbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.pbars .b i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--teal);min-height:2px}
.pbars .b i.lo{background:var(--legs)}
.pbars .b small{font-size:10px;color:var(--muted)}
.pbars .tl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);opacity:.45;pointer-events:none}
.meal{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.meal ul{margin:0;padding-left:18px;font-size:13.5px}
.meals{display:grid;gap:10px}
@media (min-width:640px){.meals{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* progress */
.chart{width:100%;min-height:60px}
.chart svg{display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.vol-row{display:grid;grid-template-columns:92px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13.5px}
.vol-track{position:relative;height:14px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.vol-track .zone{position:absolute;top:0;bottom:0;background:var(--teal-soft)}
.vol-track i{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--ink)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px 54px;gap:8px;align-items:center;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.hist-li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

/* coach */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.bubble.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;white-space:pre-wrap}
.bubble.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.assistant p+p,.bubble.assistant ul{margin-top:6px}
.bubble.assistant ul{margin-bottom:0;padding-left:18px}
.bubble .think{color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-top:8px}
@media (min-width:980px){.composer{bottom:12px}}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px;max-height:140px}
.sugg{display:flex;flex-wrap:wrap;gap:7px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

async function flushWrite(path){
  const q = writeQ[path]; q.busy = true;
  while (q.next !== undefined){
    const d = q.next; q.next = undefined;
    try { d === null ? await db.doc(path).delete() : await db.doc(path).set(d); }
    catch (e) {
      if (e?.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*800)); if (q.next === undefined) q.next = d; continue; }
      toast(e?.code === "quota_exceeded" ? "Stockage plein : supprime d'anciennes données." : "Sauvegarde impossible pour l'instant.");
    }
  }
  q.busy = false;
}
function writeDoc(path, data){ // data === null → delete
  persistCache();

  if (S.mode !== "cloud" || !db) return;
  const q = writeQ[path] || (writeQ[path] = {busy:false, next:undefined});

}

  db.doc("app/profile").onSnapshot(s => { ok(s); if (s.exists) S.profile = {...DEFAULT_PROFILE, ...s.data()}; persistCache(); softRender(); }, err);

// Double progression : on monte les reps dans la fourchette, puis la charge.
function nextTarget(item){
  const ex = EX[item.ex], hist = historyFor(item.ex);
  if (!hist.length) return {w:ex.start, reps:item.min, delta:0, kind:"start",
    reason: "Charge de départ indicative : ajuste-la pour garder 2 reps en réserve"};
  const last = hist[0], W = topW(last.sets);
  const reps = last.sets.filter(s => (+s.w||0) >= W).map(s => +s.r || 0);
  const enough = reps.length >= item.sets;
  const allTop = enough && reps.every(r => r >= item.max);
  const allMin = enough && reps.every(r => r >= item.min);
  if (allTop) {
    const reprise = inReprise();
    const mult = (last.feel === "easy" || (reprise && last.feel !== "hard")) ? 2 : 1;
    const inc = ex.inc * mult;
    return {w:fixf(W+inc), reps:item.min, delta:inc, kind:"up",
      reason: `${item.max} ${ex.rl || "reps"} sur toutes les séries` + (mult > 1 ? (last.feel === "easy" ? " et c'était facile" : " · phase de démarrage, on accélère") : "")};
  }
  if (allMin) {
    const tr = Math.min(item.max, Math.min(...reps) + (last.feel === "easy" ? 2 : 1));
    if (ex.rl) { const ts = Math.min(item.max, Math.min(...reps) + 5); return {w:W, reps:ts, delta:0, kind:"reps", reason:"Même charge, +5 s par série"}; }
    return {w:W, reps:tr, delta:0, kind:"reps", reason: last.feel === "easy" ? "Facile : même charge, +2 reps par série" : "Même charge, +1 rep par série"};
  }
  let stalls = 0;
  for (const e of hist) {
    const w2 = topW(e.sets); if (w2 !== W) break;
    const r2 = e.sets.filter(s => (+s.w||0) >= w2).map(s => +s.r||0);
    if (r2.length >= item.sets && r2.every(r => r >= item.min)) break;
    stalls++;
  }
  if (stalls >= 2) {
    const nw = Math.max(ex.inc, fixf(Math.round(W*0.9/ex.inc)*ex.inc));
    return {w:nw, reps:item.min, delta:fixf(nw-W), kind:"down", reason:"2 séances sous la fourchette : -10 % pour relancer la progression"};
  }
  return {w:W, reps:item.min, delta:0, kind:"hold", reason:"Garde la charge et vise le bas de la fourchette sur toutes les séries"};
}

function legsCatchup(){

function insights(){
  const out = [], tg = targets(), pa = proteinAvg(7), tr = weightTrend(), lc = legsCatchup(), cw = cardioWeek(), lastC = lastCardio();
  if (tg.missing) out.push(["info","i","Renseigne ton poids dans le profil : tes objectifs protéines et calories seront calculés pour toi (2 g de protéines par kg)."]);
  if (pa.avg == null) out.push(["warn","P",`Note ce que tu manges dans <a href="#food">Nutrition</a>. Objectif : <b>${tg.protein} g de protéines</b> par jour.`]);
  else if (pa.avg < tg.protein*0.9) out.push(["bad","P",`Protéines : <b>${Math.round(pa.avg)} g</b> en moyenne sur ${pa.n} j, pour un objectif de ${tg.protein} g. Il manque ~${Math.round(tg.protein - pa.avg)} g : un shake whey (25 g) + une boîte de thon (36 g) comblent l'écart.`]);
  else out.push(["good","P",`Protéines au top : <b>${Math.round(pa.avg)} g</b>/jour en moyenne (${pa.hit}/${pa.n} jours à l'objectif).`]);
  if (tr != null && S.profile.goal === "bulk") {
    const lo = (tg.bw||75)*0.0025, hi = (tg.bw||75)*0.005;
    if (tr < lo) out.push(["warn","kg",`Poids : ${tr >= 0 ? "+" : ""}${fmt(tr,2)} kg/sem. Pour une prise de muscle propre, vise +${fmt(lo,2)} à +${fmt(hi,2)} kg/sem. Ajoute ~150 kcal (ex. 40 g de riz cru en plus).`]);
    else if (tr > hi*1.4) out.push(["warn","kg",`Poids : +${fmt(tr,2)} kg/sem, c'est un peu rapide (gras). Retire ~150 kcal par jour.`]);
    else out.push(["good","kg",`Poids : +${fmt(tr,2)} kg/sem, dans la cible d'une prise de muscle propre.`]);
  }
  if (lastC && (+lastC.back||0) >= 4) out.push(["bad","D",`Ton bas du dos était à <b>${lastC.back}/10</b> au dernier cardio. Prochaine séance : tapis incliné, et fais la routine mobilité. Si la douleur dure plus de 2 semaines, descend dans la jambe ou s'accompagne de fourmillements, consulte un médecin ou un kiné.`]);
  out.push([cw.min >= CARDIO_TARGET_MIN ? "good" : "info","C",`Cardio : <b>${cw.min} min</b> cette semaine sur ${CARDIO_TARGET_MIN}, et ${cw.mob} séance(s) de mobilité sur 3. Prochaine sortie : <a href="#cardio">${h(CARDIO[nextCardioType()].name)}</a>, ${CARDIO[nextCardioType()].lv[cardioLevel(nextCardioType())].min} min.`]);
  if (lc.legs != null && lc.upper != null) out.push([lc.legs >= lc.upper ? "good" : "warn","J",`Rattrapage jambes : force <b>${pct(lc.legs)}</b> sur les jambes contre ${pct(lc.upper)} sur le haut depuis la reprise. ${lc.legs >= lc.upper ? "Les jambes progressent plus vite, c'est le but." : "Les jambes doivent progresser plus vite que le haut : pousse fort sur le hack squat et la presse."}`]);
  else out.push(["warn","J","Une seule séance jambes par semaine : pousse fort sur le hack squat et le hip thrust, c'est là que se joue le rattrapage. Le KPI « rattrapage jambes » apparaît après 2 séances de chaque exercice."]);
  if (inReprise()) out.push(["info","R","Phase de démarrage (3 premières semaines) : calibre tes charges. Quand toutes les séries touchent le haut de la fourchette, la charge monte deux fois plus vite."]);
  const ap = activeProfile();
  if (ap && S.sessions.length >= 3 && (!ap.lastExport || Date.now() - ap.lastExport > 14*DAY))
    out.unshift(["warn","S",`Tes données ne sont que sur cet appareil. ${ap.lastExport ? "Dernière sauvegarde il y a plus de 2 semaines." : "Tu n'as jamais fait de sauvegarde."} <button class="btn btn-sm" data-act="export" style="margin-top:6px">Exporter mes données</button>`]);
  return out.slice(0, 6);
}

/* Routine mobilité guidée, dans l'overlay plein écran */
let M = null, mobT = null;
function startMobility(){
  M = {i:0, end:Date.now() + MOBILITY[0].s*1000, paused:null, startedAt:Date.now()};
  const el = $("#workout"); el.hidden = false; el.setAttribute("style", "--sess:var(--pull);--sess-soft:var(--pull-soft)"); document.body.classList.add("lock");
  try { navigator.wakeLock?.request("screen").then(l => wakeLock = l).catch(() => {}); } catch {}
  renderMobility(); clearInterval(mobT); mobT = setInterval(tickMobility, 250);
}
function renderMobility(){
  const m = MOBILITY[M.i];
  $("#workout").innerHTML = `<div class="w-head"><div class="w-head-in"><button class="icon-btn" data-m="quit" aria-label="Quitter la routine">✕</button>
    <div class="w-title"><h2>Mobilité</h2><span class="small muted num">${M.i+1}/${MOBILITY.length} · ~${mobMinutes()} min</span></div></div>
    <div class="w-prog"><i style="width:${M.i/MOBILITY.length*100}%"></i></div></div>
  <div class="w-body"><section class="mob-now"><p class="eyebrow">Exercice ${M.i+1}</p><h2>${h(m.n)}</h2><div class="mob-t num" id="mobT">${mmss(m.s)}</div><p>${h(m.d)}</p>
    <div class="row" style="justify-content:center"><button class="btn" data-m="prev" ${M.i === 0 ? "disabled" : ""}>Précédent</button><button class="btn btn-primary" data-m="pause" id="mobP" style="background:var(--sess);border-color:var(--sess)">${M.paused ? "Reprendre" : "Pause"}</button><button class="btn" data-m="next">${M.i === MOBILITY.length-1 ? "Terminer" : "Suivant"}</button></div></section>
    <div class="card">${MOBILITY.map((x,k) => `<div class="kv small" style="${k === M.i ? "font-weight:700;color:var(--sess)" : k < M.i ? "opacity:.5" : ""}"><span>${h(x.n)}</span><span class="num">${x.s} s</span></div>`).join("")}</div></div>`;
}
function tickMobility(){
  if (!M || M.paused) return;
  const left = (M.end - Date.now())/1000, el = $("#mobT");
  if (el) el.textContent = mmss(left);
  if (left <= 0) { beep(); mobGo(M.i + 1); }
}
function mobGo(i){
  if (i >= MOBILITY.length) return finishMobility();
  M.i = Math.max(0, i); M.end = Date.now() + MOBILITY[M.i].s*1000; M.paused = null; renderMobility();
}
function stopMobility(){ clearInterval(mobT); M = null; $("#workout").hidden = true; document.body.classList.remove("lock"); try { wakeLock?.release(); } catch {} wakeLock = null; }
function finishMobility(){
  const min = Math.max(1, Math.round((Date.now() - M.startedAt)/60000));
  stopMobility();
  addCardio({id:"m" + Date.now().toString(36), date:new Date().toISOString(), type:"mob", min, done:true});
  render(); toast(`Routine mobilité enregistrée (${min} min)`);
}
$("#workout").addEventListener("click", ev => {
  const b = ev.target.closest("[data-m]"); if (!b || !M) return;
  const a = b.dataset.m;
  if (a === "quit") { stopMobility(); render(); return; }
  if (a === "prev") return mobGo(M.i - 1);
  if (a === "next") return mobGo(M.i + 1);
  if (a === "pause") {
    if (M.paused) { M.end = Date.now() + M.paused; M.paused = null; } else M.paused = Math.max(0, M.end - Date.now());
    b.textContent = M.paused ? "Reprendre" : "Pause";
  }
});

/* ---------- CHARTS ---------- */
function niceTicks(min, max, n=4){
  const raw = (max-min)/n || 1, mag = 10**Math.floor(Math.log10(raw)), nr = raw/mag;
  const step = (nr < 1.5 ? 1 : nr < 3 ? 2 : nr < 7 ? 5 : 10)*mag;
  const out = []; for (let v = Math.floor(min/step)*step; v <= Math.ceil(max/step)*step + step*1e-6; v += step) out.push(+v.toFixed(6));
  return out;
}
function lineChart(el, series, {ref=null, unit="kg", H=200}={}){
  const pts = series.flatMap(s => s.pts);
  if (!pts.length) { el.innerHTML = `<p class="empty">${el.dataset.empty || "Pas encore de données."}</p>`; return; }
  const W = Math.max(280, el.clientWidth || 600), pl = 40, pr = 14, pt = 12, pb = 26;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if (x1 - x0 < 6*DAY) { const mid = (x0+x1)/2; x0 = mid - 3.5*DAY; x1 = mid + 3.5*DAY; }
  let y0 = Math.min(...pts.map(p => p.y), ref ?? Infinity), y1 = Math.max(...pts.map(p => p.y), ref ?? -Infinity);
  const sp = (y1 - y0) || Math.max(2, y1*0.06); y0 -= sp*0.15; y1 += sp*0.15;
  const ticks = niceTicks(y0, y1, 4); y0 = ticks[0]; y1 = ticks[ticks.length-1];
  const X = x => pl + (x-x0)/(x1-x0)*(W-pl-pr), Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g = ticks.map(t => `<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`).join("");
  const nx = W < 420 ? 3 : 5;
  for (let i = 0; i < nx; i++) { const x = x0 + (x1-x0)*i/(nx-1); g += `<text x="${X(x)}" y="${H-6}" text-anchor="${i === 0 ? "start" : i === nx-1 ? "end" : "middle"}">${new Date(x).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>`; }
  if (ref != null) g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--muted)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W-pr}" y="${Y(ref)-6}" text-anchor="end">avant pause ${fmt(ref,0)} ${unit}</text>`;
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = s.pts.map((p,i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");

}

  if (a === "feel") { e.feel = e.feel === b.dataset.k ? null : b.dataset.k; $$(`[data-w="feel"][data-i="${i}"]`, $("#workout")).forEach(x => x.classList.toggle("on", x.dataset.k === e.feel)); saveDraft(); return; }
  if (a === "addset") { const l = e.sets[e.sets.length-1] || {w:e.t.w, r:e.t.reps}; e.sets.push({w:l.w, r:l.r, done:false}); }
  if (a === "rmset" && e.sets.length > 1) e.sets.pop();
  saveDraft();
  const y = $("#workout").scrollTop; renderWorkout(); $("#workout").scrollTop = y;
});
function finishWorkout(){
  const doneSets = W.entries.reduce((a,e) => a + e.sets.filter(s => s.done).length, 0);
  if (!doneSets) {
    openSheet(`<h2>Aucune série validée</h2><p>Valide tes séries avec le bouton ✓ pour qu'elles soient enregistrées. Tu veux abandonner cette séance ?</p>
      <div class="row"><button class="btn btn-primary" data-s="abandon">Abandonner la séance</button><button class="btn" data-close>Continuer</button></div>`, sh => {
      sh.querySelector('[data-s="abandon"]').onclick = () => { LS.del(DRAFT_KEY()); W = null; closeSheet(); closeWorkout(); };
    });
    return;
  }
  const min = Math.max(1, Math.round((Date.now() - W.startedAt)/60000));
  const before = {}; W.entries.forEach(e => before[e.ex] = bestE1(e.ex));
  const log = {id:"s" + Date.now().toString(36), date:new Date().toISOString(), sessionId:W.sessionId, rot:W.rot, min, warmup:(W.wu||[]).filter(Boolean).length,
    entries: W.entries.map(e => ({ex:e.ex, feel:e.feel, sets:e.sets.filter(s => s.done).map(s => ({w:+s.w||0, r:+s.r||0}))})).filter(e => e.sets.length)};
  S.sessions = [...S.sessions, log];
  writeDoc("sessions/" + log.id, log);
  const sid = W.sessionId; LS.del(DRAFT_KEY()); W = null; stopRest();
  closeWorkout();
  const vol = log.entries.filter(e => isLift(e.ex)).reduce((a,e) => a + e.sets.reduce((b,x) => b + x.w*x.r, 0), 0);
  const prs = log.entries.filter(e => isLift(e.ex) && before[e.ex] && Math.max(...e.sets.map(x => e1rm(x.w, x.r))) > before[e.ex] + 0.01);
  const nxt = SESSIONS[sid].items.map(it => ({it, t:nextTarget(it)}));
  openSheet(`<p class="eyebrow">Séance enregistrée</p><h2>${h(SESSIONS[sid].name)} terminée</h2>
    <div class="grid2"><div class="tile"><span class="eyebrow">Durée</span><span class="big num">${min}<small>min</small></span></div><div class="tile"><span class="eyebrow">Tonnage</span><span class="big num">${fmt(vol/1000,1)}<small>t</small></span></div></div>
    ${prs.length ? `<div class="pr" style="background:var(--teal-soft)"><b>${prs.length} record(s) battu(s)</b>${prs.map(e => h(EX[e.ex].name)).join(", ")}</div>` : ""}
    <div><p class="eyebrow" style="margin-bottom:4px">La prochaine fois</p>${nxt.map(({it,t}) => `<div class="kv"><span>${h(EX[it.ex].name)}<br><span class="small muted">${h(t.reason)}</span></span><span class="num" style="text-align:right;white-space:nowrap"><b>${fmt(t.w)} kg × ${t.reps}${EX[it.ex].rl ? " s" : ""}</b><br>${chipFor(t)}</span></div>`).join("")}</div>
    <p class="small muted">Pense à tes protéines : un shake whey + lait dans l'heure, c'est ~35 g.</p>
    ${SESSIONS[sid].mob ? `<button class="btn btn-block" data-mobgo style="border-color:var(--pull);color:var(--pull)">Lancer la routine mobilité (${mobMinutes()} min)</button>` : ""}
    <button class="btn btn-primary btn-block" data-close>Parfait</button>`, sh => sh.querySelector("[data-mobgo]")?.addEventListener("click", () => { closeSheet(); startMobility(); }));
}

/* ================= SHEETS ================= */
function openSheet(html, onMount){
  const sh = $("#sheet"); sh.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; sh.hidden = false;
  sh.onclick = ev => { if (ev.target === sh || ev.target.closest("[data-close]")) closeSheet(); };
  onMount?.(sh); sh.querySelector("input,button")?.focus();
}
function closeSheet(){ const sh = $("#sheet"); sh.hidden = true; sh.innerHTML = ""; }
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
function profileSheet(){
  const p = S.profile, tg = targets();
  const ap = activeProfile();
  openSheet(`<h2>Profil & objectifs</h2>
    <section class="card" style="gap:10px">
      <div class="spread"><span class="row" style="gap:10px"><span class="avatar lg">${h(ap.name.charAt(0).toUpperCase())}</span><span><b>${h(ap.name)}</b><br><span class="small muted">${S.sessions.length} séance(s) · ${ap.lastExport ? "sauvegardé le " + fmtDate(new Date(ap.lastExport).toISOString()) : "jamais sauvegardé"}</span></span></span></div>
      <div class="row"><button class="btn btn-sm" type="button" data-p="export">Exporter mes données</button><button class="btn btn-sm" type="button" data-p="import">Importer</button><button class="btn btn-sm" type="button" data-p="switch">Changer de profil</button></div>
      <p class="small muted">Tes données restent sur cet appareil. Exporte-les régulièrement : le fichier te permet de les retrouver sur un autre téléphone ou après avoir vidé ton navigateur.</p>
    </section>
    <form id="pf" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="pf-name">Nom du profil</label><input class="input" id="pf-name" maxlength="30" value="${h(ap.name)}" required></div>
      <div class="grid2">
        <div class="field"><label for="pf-kg">Poids (kg)</label><input class="input num" id="pf-kg" type="number" step="0.1" inputmode="decimal" value="${p.kg ?? (tg.bw ? fmt(tg.bw).replace(",", ".") : "")}"></div>
        <div class="field"><label for="pf-h">Taille (cm)</label><input class="input num" id="pf-h" type="number" inputmode="numeric" value="${p.heightCm ?? ""}"></div>
        <div class="field"><label for="pf-age">Âge</label><input class="input num" id="pf-age" type="number" inputmode="numeric" value="${p.age ?? ""}"></div>
        <div class="field"><label for="pf-sex">Sexe</label><select class="input" id="pf-sex"><option value="m" ${p.sex !== "f" ? "selected" : ""}>Homme</option><option value="f" ${p.sex === "f" ? "selected" : ""}>Femme</option></select></div>
        <div class="field"><label for="pf-week">Séances / semaine</label><select class="input" id="pf-week">${[3,4,5,6].map(n => `<option ${+p.perWeek === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
        <div class="field"><label for="pf-goal">Objectif</label><select class="input" id="pf-goal"><option value="bulk" ${p.goal === "bulk" ? "selected" : ""}>Prise de muscle</option><option value="recomp" ${p.goal === "recomp" ? "selected" : ""}>Recomposition</option><option value="cut" ${p.goal === "cut" ? "selected" : ""}>Sèche</option></select></div>
        <div class="field"><label for="pf-ppk">Protéines (g / kg)</label><select class="input" id="pf-ppk">${[1.6,1.8,2,2.2].map(n => `<option value="${n}" ${+p.ppk === n ? "selected" : ""}>${fmt(n)}</option>`).join("")}</select></div>
        <div class="field"><label for="pf-kcal">Calories (forcer)</label><input class="input num" id="pf-kcal" type="number" inputmode="numeric" placeholder="auto" value="${p.kcalOverride ?? ""}"></div>
      </div>
      <p class="small muted">Calories auto = métabolisme (Mifflin-St Jeor) × activité + 250 kcal en prise de muscle.</p>
      <div class="row"><button class="btn btn-primary" type="submit" style="flex:1">Enregistrer</button><button class="btn" type="button" data-close>Annuler</button></div>
    </form>`, sh => {
    sh.querySelector('[data-p="export"]').onclick = () => exportData();
    sh.querySelector('[data-p="import"]').onclick = () => pickImport();
    sh.querySelector('[data-p="switch"]').onclick = () => profilesSheet();
    sh.querySelector("#pf").onsubmit = ev => {
      ev.preventDefault();
      const nm = sh.querySelector("#pf-name").value.trim().slice(0,30);
      if (nm && nm !== ap.name) { ap.name = nm; saveProfiles(); }
      const num = id => { const v = sh.querySelector(id).value; return v === "" ? null : +v; };
      const kg = num("#pf-kg");
      saveProfile({kg, heightCm:num("#pf-h"), age:num("#pf-age"), sex:sh.querySelector("#pf-sex").value, perWeek:+sh.querySelector("#pf-week").value, goal:sh.querySelector("#pf-goal").value, ppk:+sh.querySelector("#pf-ppk").value, kcalOverride:num("#pf-kcal")});
      if (kg && !S.body.length) addWeight(kg);
      closeSheet(); render(); toast("Profil enregistré");
    };
  });
}
function profilesSheet(){
  openSheet(`<h2>Profils sur cet appareil</h2>
    <div style="display:flex;flex-direction:column;gap:8px">${PR.list.map(p => `<button class="btn btn-block" data-sw="${h(p.id)}" style="justify-content:space-between"><span class="row" style="gap:10px"><span class="avatar">${h(p.name.charAt(0).toUpperCase())}</span>${h(p.name)}</span>${p.id === PR.active ? `<span class="chip up">actif</span>` : ""}</button>`).join("")}</div>
    <form id="np" class="row" style="align-items:flex-end">
      <div class="field" style="flex:1 1 180px"><label for="np-name">Nouveau profil</label><input class="input" id="np-name" maxlength="30" placeholder="Prénom ou pseudo" required></div>
      <button class="btn btn-primary" type="submit">Créer</button>
    </form>
    <button class="btn btn-ghost" data-p="del" style="color:var(--bad);align-self:flex-start">Supprimer le profil « ${h(activeProfile()?.name)} »</button>
    <button class="btn" data-close>Fermer</button>`, sh => {
    sh.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { closeSheet(); switchProfile(b.dataset.sw); toast(`Profil : ${activeProfile().name}`); });
    sh.querySelector("#np").onsubmit = ev => { ev.preventDefault(); const n = sh.querySelector("#np-name").value.trim(); if (!n) return; createProfile(n); closeSheet(); W = null; render(); toast(`Profil ${n} créé`); };
    sh.querySelector('[data-p="del"]').onclick = () => {
      const p = activeProfile();
      openSheet(`<h2>Supprimer « ${h(p.name)} » ?</h2><p>Toutes ses séances, pesées et données nutrition seront effacées de cet appareil. C'est définitif, sauf si tu as exporté une sauvegarde.</p>
        <div class="row"><button class="btn btn-primary" data-s="del" style="background:var(--bad);border-color:var(--bad)">Supprimer définitivement</button><button class="btn" data-close>Annuler</button></div>`, s2 => {
        s2.querySelector('[data-s="del"]').onclick = () => { deleteProfile(p.id); closeSheet(); toast("Profil supprimé"); };
      });
    };
  });
}
function exportData(){
  const p = activeProfile(); if (!p) return;
  const payload = {app:"forge-ppl", v:1, exportedAt:new Date().toISOString(), name:p.name, data:exportPayload()};
  const slug = p.name.normalize("NFD").replace(/[^\w-]+/g, "-").replace(/-+/g, "-").toLowerCase() || "profil";
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload)], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = `forge-ppl-${slug}-${dayKey()}.json`;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    p.lastExport = Date.now(); saveProfiles(); render(); toast("Sauvegarde téléchargée");
  } catch { toast("Export impossible sur ce navigateur"); }
}
function pickImport(){ const inp = $("#importFile"); inp.value = ""; inp.click(); }
function readImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    let p; try { p = JSON.parse(fr.result); } catch { return toast("Fichier illisible : choisis un export Forge PPL (.json)"); }
    if (p?.app !== "forge-ppl" || !p.data || !Array.isArray(p.data.sessions)) return toast("Ce fichier n'est pas une sauvegarde Forge PPL");
    const name = String(p.name || "Profil importé").slice(0,30);
    const summary = `${p.data.sessions.length} séance(s), ${(p.data.body||[]).length} pesée(s), ${(p.data.cardio||[]).length} cardio · exporté le ${fmtDate(p.exportedAt || new Date().toISOString())}`;
    const asNew = () => { createProfile(name, p.data); closeSheet(); W = null; render(); toast(`Profil ${name} importé`); };
    if (!activeProfile()) return asNew();
    openSheet(`<h2>Importer « ${h(name)} »</h2><p class="small muted">${h(summary)}</p>
      <div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-primary" data-s="new">Créer un nouveau profil « ${h(name)} »</button>
      <button class="btn" data-s="replace">Remplacer les données de « ${h(activeProfile().name)} »</button><button class="btn btn-ghost" data-close>Annuler</button></div>
      <p class="small muted">Remplacer efface définitivement les données actuelles de ce profil sur cet appareil.</p>`, sh => {
      sh.querySelector('[data-s="new"]').onclick = asNew;
      sh.querySelector('[data-s="replace"]').onclick = () => { applyData(p.data); persistCache(); closeSheet(); render(); toast("Données remplacées"); };
    });
  };
  fr.readAsText(file);
}
function weighSheet(){
  const last = S.body[S.body.length-1];
  openSheet(`<h2>Pesée du jour</h2><form id="wf" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><label for="wf-kg">Poids (kg), le matin à jeun</label><input class="input num" id="wf-kg" type="number" step="0.1" inputmode="decimal" value="${last ? last.kg : (S.profile.kg ?? "")}" required></div>
    <div class="field"><label for="wf-d">Date</label><input class="input" id="wf-d" type="date" value="${dayKey()}" max="${dayKey()}"></div>
    <div class="row"><button class="btn btn-teal" type="submit" style="flex:1">Enregistrer</button><button class="btn" type="button" data-close>Annuler</button></div></form>`, sh => {
    sh.querySelector("#wf").onsubmit = ev => { ev.preventDefault(); const kg = +sh.querySelector("#wf-kg").value; if (!(kg > 30 && kg < 250)) return toast("Poids invalide"); addWeight(Math.round(kg*10)/10, sh.querySelector("#wf-d").value || dayKey()); closeSheet(); render(); toast("Pesée enregistrée"); };
    sh.querySelector("#wf-kg").select();
  });
}
function chooseSheet(){
  const rec = ROT[nextRotIndex()];
  openSheet(`<h2>Choisir la séance</h2><p class="small muted">La rotation reprendra après la séance choisie.</p>
    ${activeSessions().map(([id,s]) => `<button class="btn btn-block" data-s="${id}" style="justify-content:space-between;${sessColor(id)};border-left:5px solid var(--sess)"><span style="text-align:left"><b>${s.name}</b><br><span class="small muted">${s.sub} · ~${estMinutes(id)} min</span></span>${id === rec ? `<span class="chip up">recommandée</span>` : ""}</button>`).join("")}
    <button class="btn btn-ghost" data-close>Annuler</button>`, sh => {
    sh.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { closeSheet(); tryStart(b.dataset.s); });
  });
}
function tryStart(id){
  if (LS.get(DRAFT_KEY(), null)) {
    openSheet(`<h2>Séance déjà en cours</h2><p>Une séance non terminée est en mémoire. La remplacer par ${h(SESSIONS[id].name)} ?</p><div class="row"><button class="btn btn-primary" data-s="go">Remplacer</button><button class="btn" data-s="resume">Reprendre l'ancienne</button></div>`, sh => {
      sh.querySelector('[data-s="go"]').onclick = () => { closeSheet(); startWorkout(id); };
      sh.querySelector('[data-s="resume"]').onclick = () => { closeSheet(); W = LS.get(DRAFT_KEY(), null); if (W) openWorkout(); };
    });
  } else startWorkout(id);
}

/* ================= EVENTS ================= */
$("#btnProfile").onclick = profileSheet;
$("#importFile").addEventListener("change", ev => { const f = ev.target.files?.[0]; if (f) readImport(f); });
$("#view").addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "start") tryStart(b.dataset.id);
  else if (a === "resume") { W = LS.get(DRAFT_KEY(), null); if (W) openWorkout(); }
  else if (a === "choose") chooseSheet();
  else if (a === "profile") profileSheet();
  else if (a === "export") exportData();
  else if (a === "import") pickImport();
  else if (a === "weigh") weighSheet();
  else if (a === "fday") { const n = addDays(foodDay, +b.dataset.d); if (n <= dayKey()) { foodDay = n; render(); } }
  else if (a === "qa") { const f = FOODS[+b.dataset.i]; addFood(foodDay, {n:f[0], p:f[1], k:f[2]}); render(); toast(`+${f[1]} g de protéines`); }
  else if (a === "meal") { const m = MEALS[+b.dataset.i]; addFood(foodDay, {n:m.n, p:m.p, k:m.k}); render(); toast(`${m.n} ajouté`); }
  else if (a === "rmfood") { removeFood(foodDay, +b.dataset.i); render(); }
  else if (a === "delsess") {
    const s = S.sessions.find(x => x.id === b.dataset.id); if (!s) return;
    openSheet(`<h2>Supprimer la séance ?</h2><p>${h(SESSIONS[s.sessionId]?.name)} du ${fmtDate(s.date, {weekday:"long", day:"numeric", month:"long"})}. La suppression est définitive et les prochaines charges seront recalculées.</p>
      <div class="row"><button class="btn btn-primary" data-s="del">Supprimer</button><button class="btn" data-close>Annuler</button></div>`, sh => {
      sh.querySelector('[data-s="del"]').onclick = () => { S.sessions = S.sessions.filter(x => x.id !== s.id); writeDoc("sessions/" + s.id, null); closeSheet(); render(); toast("Séance supprimée"); };
    });
  }
  else if (a === "logc") cardioSheet(b.dataset.t);
  else if (a === "mob") startMobility();
  else if (a === "delc") {
    const c = S.cardio.find(x => x.id === b.dataset.id); if (!c) return;
    openSheet(`<h2>Supprimer ce cardio ?</h2><p>Séance du ${fmtDate(c.date, {weekday:"long", day:"numeric", month:"long"})}, ${c.min} min. La suppression est définitive et ton niveau sera recalculé.</p>
      <div class="row"><button class="btn btn-primary" data-s="del">Supprimer</button><button class="btn" data-close>Annuler</button></div>`, sh => {
      sh.querySelector('[data-s="del"]').onclick = () => { S.cardio = S.cardio.filter(x => x.id !== c.id); writeDoc("cardio/" + c.id, null); closeSheet(); render(); toast("Séance supprimée"); };
    });
  }
  else if (a === "sugg") askCoach(b.textContent);
  else if (a === "clearchat") { if (busy) chatCtl?.abort(); chat.length = 0; LS.set("forge-chat", []); render(); }
});
$("#view").addEventListener("change", ev => { if (ev.target.id === "pg-ex") { chartEx = ev.target.value; drawCharts(); } });
$("#view").addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "welcomeForm") {
    const n = $("#wl-name").value.trim(); if (!n) return;
    createProfile(n, LEGACY);
    if (LEGACY) LS.del("forge-cache");
    go("home"); toast(`Bienvenue ${n} ! Renseigne ton poids dans le profil.`);
    return;
  }
  if (ev.target.id === "foodForm") {
    const n = $("#ff-n").value.trim(), p = +$("#ff-p").value, k = +$("#ff-k").value || 0;
    if (!n || !(p >= 0)) return;
    addFood(foodDay, {n, p, k});
    ["#ff-n","#ff-p","#ff-k"].forEach(s => $(s).value = "");
    render(); toast(`+${Math.round(p)} g de protéines`);
  }
  if (ev.target.id === "chatForm") {
    if (busy) { chatCtl?.abort(); return; }
    const t = $("#chatIn").value; $("#chatIn").value = ""; askCoach(t);
  }
});
$("#view").addEventListener("keydown", ev => { if (ev.target.id === "chatIn" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("#chatForm").requestSubmit(); } });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== viewState) go(v); });

document.addEventListener("click", ev => {
  const z = ev.target.closest("[data-zoom]"); if (!z) return;
  ev.preventDefault();
  const ex = EX[z.dataset.zoom]; if (!ex) return;
  openSheet(`<h2>${h(ex.name)}</h2><p class="small muted">${h(ex.fr)}</p>${exAnim(z.dataset.zoom, "big")}<p>${h(ex.cue)}</p><p class="small muted">Alternative : ${h(ex.alt)}${EX_IMG[z.dataset.zoom] ? " · photo d'un exercice proche" : ""}</p><button class="btn btn-block" data-close>Fermer</button>`);
});

/* ================= BOOT ================= */
render();
initRuntime();
const draft0 = LS.get(DRAFT_KEY(), null);
if (draft0 && Date.now() - draft0.startedAt > 12*3600*1000) LS.del(DRAFT_KEY());
</script>
